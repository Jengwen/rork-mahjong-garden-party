workflows:
  ios-workflow:
    name: Mahjong Garden Party - iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "Codemagic CI"   # used for uploading to TestFlight
    environment:
      ios_signing:
        # Reference names as shown in Codemagic > Settings > Code signing identities
        provisioning_profiles:
          - Mahjong Garden
        certificates:
          - Codemagic Distribution
      vars:
        XCODE_PROJECT: "ios/MahjongGardenParty.xcodeproj"
        XCODE_SCHEME: "MahjongGardenParty"
        APP_STORE_APPLE_ID: 6793677304
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Apply uploaded signing files to the Xcode project
        script: |
          xcode-project use-profiles

      - name: Resolve Swift Package dependencies
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"

      - name: Build ipa for distribution
        script: |
          # 1. Get the highest build number already on TestFlight for this app.
          #    (Not the App Store number — the app hasn't been released there,
          #    so that query returns a stale value.)
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo "")
          if [ -z "$LATEST" ]; then
            # Fallback: epoch seconds are always increasing and unique.
            BUILD_NUM=$(date +%s)
          else
            BUILD_NUM=$((LATEST + 1))
          fi
          echo "Latest on TestFlight: '$LATEST' -> building CFBundleVersion $BUILD_NUM"

          # 2. Write the number straight into the project file so it always
          #    takes effect (archive-xcargs overrides are unreliable with
          #    GENERATE_INFOPLIST_FILE = YES).
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUM;/g" \
            "$XCODE_PROJECT/project.pbxproj"
          echo "Confirming the change stuck:"
          grep -m1 "CURRENT_PROJECT_VERSION" "$XCODE_PROJECT/project.pbxproj"

          # 3. Archive & export.
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGN_STYLE=Manual"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
